esphome:
  name: switchbot-meter-bridge

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Pull this repository's components into the build.
external_components:
  - source:
      type: git
      url: https://github.com/onetxpanda/esphome-switchbot
    components: [switchbot_meter]

# Passive BLE scanner. Active scan is not required: SwitchBot meters
# broadcast their readings, so we only need to listen.
esp32_ble_tracker:
  scan_parameters:
    active: false

sensor:
  # Indoor Meter / Meter Plus (model T / i)
  - platform: switchbot_meter
    mac_address: "C1:11:22:33:44:55"
    temperature:
      name: "Living Room Temperature"
    humidity:
      name: "Living Room Humidity"
    battery_level:
      name: "Living Room Meter Battery"

  # Outdoor Meter (WoIOSensorTH, model w)
  - platform: switchbot_meter
    mac_address: "C2:66:77:88:99:AA"
    temperature:
      name: "Outdoor Temperature"
    humidity:
      name: "Outdoor Humidity"
    battery_level:
      name: "Outdoor Meter Battery"
